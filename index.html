<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lastro · CITi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
:root{
  color-scheme: dark;
  --bg:#050806; --surface:#111814; --surface2:#0B120D; --line:#1E2A22; --line2:#2F3E34; --line3:#1A241D;
  --text:#EEF5F0; --soft:#C5D2CA; --muted:#9FB0A5; --faint:#6B7C71;
  --green:#12A150; --green2:#5FD68A; --greenBg:#0E2E19; --greenT:#6FE39A;
  --orBg:#3A2608; --orT:#F5C27A; --orSurf:#1F1609; --orLine:#5A3D14; --orSoft:#E3B877;
  --blBg:#102440; --blT:#8DB8F0; --blSurf:#0D1726; --blLine:#23395A;
  --grBg:#23262A; --grT:#C9CCD1; --red:#F08A8A;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Barlow,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.5;min-height:100vh;overflow-x:hidden}
a{color:var(--green2)} a:hover{color:#9BEDB8}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green2);outline-offset:2px}
.blob{position:absolute;top:-150px;right:-170px;width:500px;height:500px;border-radius:42% 58% 63% 37%/45% 40% 60% 55%;background:radial-gradient(circle at 32% 30%,#8BF0AC 0%,#19B85A 22%,#0C4D25 55%,#050806 100%);transform:rotate(-18deg);pointer-events:none;z-index:0}
.blob2{position:absolute;bottom:-240px;left:-220px;width:480px;height:480px;border-radius:58% 42% 37% 63%/55% 60% 40% 45%;background:radial-gradient(circle at 60% 35%,#3FD57A 0%,#0E6B33 35%,#050806 75%);opacity:.5;transform:rotate(24deg);pointer-events:none}
.page{position:relative;overflow:hidden;min-height:100vh;padding:28px 20px 64px}
.wrap{position:relative;z-index:1;max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
nav.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 24px;padding-bottom:14px;border-bottom:1px solid var(--line3)}
.brand{font-weight:800;font-size:24px;letter-spacing:-.01em;color:var(--green);background:none;border:0;padding:0;cursor:pointer;min-height:44px}
.navlinks{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.nl{font-size:15px;font-weight:600;min-height:44px;padding:0 16px;border-radius:999px;color:var(--soft);background:none;border:0;cursor:pointer;display:inline-flex;align-items:center}
.nl:hover{color:var(--text);background:#0D140F}
.nl.on{background:var(--greenBg);color:var(--greenT);font-weight:700}
.crumb{font-size:15px;font-weight:600;color:var(--faint);padding:0 6px;min-height:44px;display:inline-flex;align-items:center}
.who{display:flex;align-items:center;gap:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--greenBg);color:var(--greenT);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--green2)}
h1.big{margin:0;font-weight:800;font-size:clamp(38px,6vw,60px);line-height:1;letter-spacing:-.02em;max-width:860px}
h2{margin:0;font-weight:800;font-size:24px;letter-spacing:-.01em}
.n{color:var(--green)}
.sub{margin:0;font-size:15px;color:var(--muted);max-width:720px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px}
.inset{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.between{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.col{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.main{flex:999 1 560px;min-width:0}
.split>.side{flex:1 1 320px;min-width:0}
.btn{font-size:15px;font-weight:600;min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:#43584A}
.btn.p{background:var(--green);border-color:var(--green);color:#050806;font-weight:700}
.btn.p:hover{background:#18B85C}
.btn.ghost{border-color:transparent;background:none;color:var(--green2)}
.btn[disabled]{opacity:.55;cursor:wait}
.chip{font-size:14px;font-weight:600;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line2);background:var(--surface);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--greenBg);border-color:var(--green);color:var(--greenT)}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;white-space:nowrap}
.b-g{background:var(--greenBg);color:var(--greenT)} .b-o{background:var(--orBg);color:var(--orT)} .b-b{background:var(--blBg);color:var(--blT)} .b-x{background:var(--grBg);color:var(--grT)}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.in{font-size:15px;min-height:46px;padding:0 12px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);width:100%}
textarea.in{padding:12px;min-height:140px;resize:vertical;line-height:1.5}
select.in{padding:0 10px}
.err{font-size:14px;color:var(--red);min-height:0}
.muted{color:var(--muted)} .soft{color:var(--soft)} .small{font-size:13px}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.bar>span{display:block;height:100%}
.stat{font-weight:800;font-size:28px;letter-spacing:-.01em;line-height:1.1}
.pcard{display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px 20px;cursor:pointer;text-align:left;width:100%;color:var(--text)}
.pcard:hover{border-color:#34503D}
.list{border:1px solid var(--line);border-radius:16px}
.li{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 16px;padding:14px 16px;border-bottom:1px solid var(--line3)}
.li:last-child{border-bottom:0}
.pend{background:var(--orSurf);border:1px solid var(--orLine);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.alt{background:var(--blSurf);border:1px solid var(--blLine);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px}
details summary{cursor:pointer;font-size:14px;font-weight:600;color:var(--green2);min-height:44px;display:flex;align-items:center}
.quote{font-size:14px;line-height:1.6;color:var(--soft);border-left:0;margin:0}
.tipos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tipo{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:16px;border:1px solid var(--line2);background:var(--surface);cursor:pointer;text-align:left;color:var(--text)}
.tipo[aria-pressed="true"]{border:2px solid var(--green);background:#0F2416}
.dot{flex:0 0 18px;height:18px;margin-top:3px;border-radius:50%;border:2px solid var(--faint)}
.tipo[aria-pressed="true"] .dot{border:6px solid var(--green)}
.drop{border:2px dashed #34503D;border-radius:24px;background:var(--surface2);padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.mic{width:76px;height:76px;border-radius:50%;border:0;background:var(--green);cursor:pointer;display:flex;align-items:center;justify-content:center}
.mic.on{background:#E25555}
.empty{border:1px dashed #34503D;border-radius:16px;padding:32px 20px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--greenBg);color:var(--greenT);border:1px solid var(--green);padding:12px 18px;border-radius:12px;font-weight:600;z-index:20}
.tbl{width:100%;border-collapse:collapse}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line3);vertical-align:middle}
.scroll{overflow-x:auto}
.spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spin{animation:none}}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
.login .box{position:relative;z-index:1;width:100%;max-width:440px;display:flex;flex-direction:column;gap:28px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>

function novoForm(){ return { nome:'', empresa:'', contrato:'', gerente:'', inicio:'', fim:'', valorHora:80, texto:'', arquivo:'', itens:[], msg:'', err:'' }; }
function reuniaoForm(){ return { tipo:'notas', texto:'', data:hojeISO(), categoria:'Com o cliente', participantes:'', arquivo:'', res:null, err:'', parcial:'', ouvindo:false }; }
function pedidoForm(){ return { texto:'', origem:'Reunião com o cliente', data:hojeISO(), res:null, err:'' }; }
S.novo = novoForm(); S.reuniao = reuniaoForm(); S.pedido = pedidoForm();

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function hojeISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function br(iso){ if(!iso) return '—'; var p=String(iso).split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0] : iso; }
function brl(n){ return 'R$ '+Math.round(n||0).toLocaleString('pt-BR'); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function proj(){ for(var i=0;i<S.projetos.length;i++){ if(S.projetos[i].id===S.pid) return S.projetos[i]; } return null; }
function toast(t){ var el=document.getElementById('toast'); el.textContent=t; el.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(function(){el.hidden=true;},2600); }
function iniciais(n){ n=(n||'').trim(); if(!n) return 'CI'; var p=n.split(/\s+/); return ((p[0]||'')[0]+((p[1]||'')[0]||'')).toUpperCase(); }
function horasPedido(x){ return Math.round(((+x.horasMin||0)+(+x.horasMax||0))/2); }

function stats(p){
  var itens=p.itens||[], peds=p.pedidos||[];
  var ent=itens.filter(function(i){return i.status==='entregue';}).length;
  var and=itens.filter(function(i){return i.status==='andamento';}).length;
  var horas=itens.reduce(function(a,i){return a+(+i.horas||0);},0);
  var g={pendente:[],cobrado:[],cortesia:[],recusado:[]};
  peds.forEach(function(x){ (g[x.status]||g.pendente).push(x); });
  function soma(arr){ return { h:arr.reduce(function(a,x){return a+horasPedido(x);},0), v:arr.reduce(function(a,x){return a+(+x.valor||0);},0), n:arr.length }; }
  var alterados=itens.filter(function(i){return i.alteracao && !i.alteracao.resolvida;});
  var temReuniao=(p.reunioes||[]).length>0;
  var esquecidos=temReuniao? itens.filter(function(i){return i.status!=='entregue' && !(i.mencoes&&i.mencoes.length);}) : [];
  return { total:itens.length, ent:ent, and:and, faz:itens.length-ent-and, pct: itens.length? Math.round(ent*100/itens.length):0,
    horas:horas, valor:horas*(+p.valorHora||0), g:g, s:{pendente:soma(g.pendente),cobrado:soma(g.cobrado),cortesia:soma(g.cortesia),recusado:soma(g.recusado)},
    alterados:alterados, esquecidos:esquecidos };
}

/* ---------- conexão (Supabase + API própria) ---------- */
var sb=null, sessao=null;
function nomeDe(email){ return String(email||'').split('@')[0].replace(/[._-]+/g,' '); }
function conectar(){
  var C=window.LASTRO_CONFIG||{};
  if(!window.supabase||!C.SUPABASE_URL||C.SUPABASE_URL.indexOf('COLE')===0){ S.loading=false; S.dbFalhou=true; S.loginErr='O site ainda não foi configurado: preencha o arquivo config.js.'; render(); return; }
  sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY);
  cap.db=true; cap.sample=true;
  if(window.SpeechRecognition||window.webkitSpeechRecognition){ cap.dict=criarDitado(); ligarDitado(cap.dict); }
}
function carregar(){
  if(!sb){ S.loading=false; S.dbFalhou=true; renderLista(); return; }
  S.loading=true; S.dbFalhou=false; renderLista();
  sb.from('projetos').select('id,dados').then(function(r){
    S.loading=false;
    if(r.error){ S.dbFalhou=true; } else { S.projetos=(r.data||[]).map(function(row){ var o=row.dados||{}; o.id=row.id; return o; }); }
    if(S.view==='projetos') renderLista(); else if(!editando()) render();
  });
}
function editando(){ return S.view==='novo' || (S.view==='projeto' && (S.tab==='reuniao'||S.tab==='pedido')) || S.view==='login'; }
function salvar(p, campos){
  for(var k in campos){ p[k]=campos[k]; }
  var d=Object.assign({},p); delete d.id;
  return sb.from('projetos').update({dados:d, atualizado_em:new Date().toISOString()}).eq('id',p.id).then(function(r){ if(r.error){ toast('Não foi possível salvar. Tente de novo.'); throw r.error; } });
}

/* ---------- IA (função /api/ia no servidor) ---------- */
function ia(prompt){
  return fetch('/api/ia',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({prompt:prompt})})
    .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ if(!r.ok) throw {code:j.code||'erro'}; return j.resultado; }); });
}
function msgErroIA(e){
  var c=e&&e.code;
  if(c==='sem_chave') return 'A chave da IA não foi configurada no servidor (GEMINI_API_KEY).';
  if(c==='rate_limited') return 'Muitas análises seguidas. Espere um minuto e tente de novo; o plano gratuito da IA tem um limite por minuto.';
  return 'A análise não terminou. Confira o texto e tente de novo.';
}
function itensTexto(p){ return (p.itens||[]).map(function(i){ return '- id '+i.id+': '+i.nome+' ('+i.horas+' h, status: '+i.status+')'; }).join('\n'); }

/* ---------- ditado por voz (Chrome e Edge) ---------- */
function criarDitado(){
  var Rec=window.SpeechRecognition||window.webkitSpeechRecognition, rec=new Rec(), h={};
  rec.lang='pt-BR'; rec.continuous=true; rec.interimResults=true;
  rec.onresult=function(e){ var parcial=''; for(var i=e.resultIndex;i<e.results.length;i++){ var t=e.results[i][0].transcript; if(e.results[i].isFinal){ if(h.f) h.f({text:t.trim()}); } else parcial+=t; } if(h.p) h.p({text:parcial}); };
  rec.onstart=function(){ if(h.s) h.s({state:'listening'}); };
  rec.onend=function(){ if(h.s) h.s({state:'idle'}); };
  rec.onerror=function(e){ if(e.error==='not-allowed'||e.error==='service-not-allowed'){ S.reuniao.err='O microfone foi bloqueado. Libere o microfone no navegador ou use “Anotações”.'; manterRender(); } };
  return { start:function(){ try{ rec.start(); }catch(x){} return Promise.resolve(); }, stop:function(){ try{ rec.stop(); }catch(x){} return Promise.resolve(); },
    onPartial:function(f){h.p=f;}, onFinal:function(f){h.f=f;}, onState:function(f){h.s=f;} };
}

/* ---------- files ---------- */
function lerArquivo(file){
  var nome=(file.name||'').toLowerCase();
  if(nome.endsWith('.pdf')){
    if(!window.pdfjsLib) return Promise.reject(new Error('pdf'));
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    return file.arrayBuffer().then(function(buf){ return pdfjsLib.getDocument({data:buf}).promise; }).then(function(pdf){
      var ps=[]; for(var i=1;i<=pdf.numPages;i++){ ps.push(pdf.getPage(i).then(function(pg){ return pg.getTextContent(); }).then(function(tc){ return tc.items.map(function(it){return it.str;}).join(' '); })); }
      return Promise.all(ps).then(function(t){ return t.join('\n'); });
    });
  }
  if(nome.endsWith('.docx')){
    if(!window.mammoth) return Promise.reject(new Error('docx'));
    return file.arrayBuffer().then(function(buf){ return mammoth.extractRawText({arrayBuffer:buf}); }).then(function(r){ return r.value; });
  }
  return file.text();
}

function ligarDitado(d){
  d.onPartial(function(e){ S.reuniao.parcial=e.text; var el=document.getElementById('parcial'); if(el) el.textContent=e.text; });

  d.onState(function(e){ S.reuniao.ouvindo=(e.state==='listening'||e.state==='starting'); var b=document.getElementById('micBtn'); if(b){ b.classList.toggle('on',S.reuniao.ouvindo); b.setAttribute('aria-label',S.reuniao.ouvindo?'Parar gravação':'Começar a gravar'); } var l=document.getElementById('micLabel'); if(l) l.textContent=S.reuniao.ouvindo?'Gravando… toque para parar':'Toque para gravar um resumo falado'; });
}

function filtrados(){
  var t=S.busca.trim().toLowerCase();
  return S.projetos.filter(function(p){
    var st=stats(p), concl= st.total>0 && st.ent===st.total;
    if(S.filtro==='andamento' && concl) return false;
    if(S.filtro==='concluidos' && !concl) return false;
    var d=p[S.dataCampo]||'';
    if(S.de && (!d || d<S.de)) return false;
    if(S.ate && (!d || d>S.ate)) return false;
    if(!t) return true;
    return ((p.nome||'')+' '+(p.empresa||'')+' '+(p.contrato||'')).toLowerCase().indexOf(t)!==-1;
  }).sort(function(a,b){ return String(a.fim||'9').localeCompare(String(b.fim||'9')); });
}

    '<div style="flex:1 1 150px" class="small muted">Início '+br(p.inicio)+'<br>Entrega '+br(p.fim)+'</div>'+
    '<div style="flex:1 1 170px" class="col" ><span class="small muted">'+st.pct+'% do contrato entregue</span><span class="bar" style="height:8px;margin-top:-6px"><span style="width:'+st.pct+'%;background:var(--green)"></span></span></div>'+
    '<div style="flex:1 1 200px;justify-content:flex-end" class="row"><span class="badge '+(concl?'b-x':'b-g')+'">'+(concl?'Concluído':'Em andamento')+'</span>'+
    (st.s.pendente.n?'<span class="badge b-o">'+st.s.pendente.n+(st.s.pendente.n===1?' pedido pendente':' pedidos pendentes')+'</span>':'')+
    ((st.alterados.length+st.esquecidos.length)?'<span class="badge b-b">'+(st.alterados.length+st.esquecidos.length)+' pontos de atenção</span>':'')+

function campo(rot,k,tipo,ph){ return '<label class="f">'+rot+'<input class="in" type="'+tipo+'" data-f="novo" data-k="'+k+'" value="'+esc(S.novo[k])+'" placeholder="'+esc(ph)+'"></label>'; }

function vPlacar(p){
  var st=stats(p);
  var cards=[['cobrado','Cobrado','b-g','pedidos viraram adicional'],['cortesia','Cortesia','b-b','feitos sem cobrar, por decisão'],['pendente','Pendente','b-o','aguardando decisão'],['recusado','Recusado','b-x','não serão feitos']].map(function(c){
    var s=st.s[c[0]], pend=c[0]==='pendente';
    return '<div class="card col" style="gap:6px;padding:20px;'+(pend?'background:var(--orSurf);border-color:var(--orLine)':'')+'"><span class="badge '+c[2]+'" style="align-self:flex-start">'+c[1]+'</span><span class="stat">'+brl(s.v)+'</span><span class="small" style="color:'+(pend?'var(--orSoft)':'var(--muted)')+'">'+s.h+' h · '+s.n+' '+c[3]+'</span></div>';
  }).join('');
  var grupos='';
  if(!(p.pedidos||[]).length) grupos='<div class="empty">Nenhum pedido fora do contrato ainda. Eles aparecem aqui quando a IA encontra um pedido novo numa reunião ou quando alguém registra um.</div>';
  st.g.pendente.forEach(function(x){
    grupos+='<div class="pend"><div class="between" style="align-items:flex-start"><div class="col" style="gap:2px"><span style="font-weight:700">'+esc(x.titulo)+'</span><span class="small" style="color:var(--orSoft)">'+esc(x.origem||'')+(x.data?' · '+br(x.data):'')+'</span></div><div style="text-align:right"><strong>'+horasPedido(x)+' h · '+brl(x.valor)+'</strong>'+(x.prazoDias?'<br><span class="small" style="color:var(--orSoft)">+'+x.prazoDias+' dias no prazo</span>':'')+'</div></div>'+
    (x.justificativa?'<p class="small soft" style="margin:0">'+esc(x.justificativa)+'</p>':'')+(x.trecho?'<details><summary>Ver trecho da reunião</summary><p class="quote inset">'+esc(x.trecho)+'</p></details>':'')+
    '<div class="row" style="gap:8px"><button class="btn p" data-a="decidir" data-v="'+x.id+'" data-s="cobrado">Cobrar</button><button class="btn" data-a="decidir" data-v="'+x.id+'" data-s="cortesia">Fazer como cortesia</button><button class="btn" data-a="decidir" data-v="'+x.id+'" data-s="recusado">Recusar</button></div></div>';
  });
  [['cobrado','Cobrado','var(--greenT)'],['cortesia','Cortesia','var(--blT)'],['recusado','Recusado','var(--grT)']].forEach(function(g){
    var arr=st.g[g[0]]; if(!arr.length) return;
    grupos+='<div class="col" style="gap:8px"><span class="small" style="font-weight:700;color:'+g[2]+'">'+g[1]+'</span><div class="list">'+arr.map(function(x){
      return '<div class="li"><div class="col" style="gap:0"><span style="font-weight:600">'+esc(x.titulo)+'</span><span class="small muted">'+esc(x.origem||'')+(x.decididoEm?' · decidido em '+br(x.decididoEm):'')+'</span></div><div class="row" style="gap:10px"><strong>'+horasPedido(x)+' h · '+brl(x.valor)+'</strong><button class="btn ghost" data-a="decidir" data-v="'+x.id+'" data-s="pendente" style="min-height:40px">Desfazer</button></div></div>';
    }).join('')+'</div></div>';
  });
  var pontos='';
  st.esquecidos.forEach(function(i){ pontos+='<div class="inset col" style="gap:6px"><span class="badge b-o" style="align-self:flex-start">Esquecido</span><strong>'+esc(i.nome)+'</strong><span class="small muted">Está no contrato, mas não foi mencionado em nenhuma reunião registrada. Entrega do projeto em '+br(p.fim)+'.</span></div>'; });
  st.alterados.forEach(function(i){ pontos+='<div class="alt"><span class="badge b-b" style="align-self:flex-start">Alterado</span><strong>'+esc(i.nome)+'</strong><span class="small soft">'+esc(i.alteracao.descricao)+'</span>'+(i.alteracao.trecho?'<details><summary>Ver trecho da reunião</summary><p class="quote inset">'+esc(i.alteracao.trecho)+'</p></details>':'')+'<button class="btn" data-a="resolver" data-v="'+i.id+'" style="align-self:flex-start">Cliente já foi avisado</button></div>'; });
  if(!pontos) pontos='<div class="empty" style="padding:20px">Nada fora do combinado até agora.</div>';
  return topo('Placar do projeto','Contrato: '+st.horas+' h · '+brl(st.valor)+' · entrega em '+br(p.fim),'<div class="row"><button class="btn" data-a="tab" data-v="reuniao">Enviar reunião</button><button class="btn p" data-a="tab" data-v="pedido">Registrar pedido</button></div>')+
  '<section class="card col" aria-label="Andamento do contrato"><div class="between"><strong>Andamento do contrato</strong><span class="muted small">'+st.ent+' de '+st.total+' itens entregues</span></div><div class="between" style="align-items:center"><div class="bar" style="flex:1 1 300px"><span style="width:'+st.pct+'%;background:var(--green)"></span></div><span class="stat" style="font-size:40px;color:var(--green2)">'+st.pct+'%</span></div><button class="btn ghost" data-a="tab" data-v="contrato" style="align-self:flex-start;padding:0">Ver contrato completo: o que já foi feito e o que falta</button></section>'+
  '<section class="grid" aria-label="Resumo dos pedidos fora do contrato">'+cards+'</section>'+
  '<div class="split"><section class="card col main" style="gap:16px"><h2>Pedidos fora do contrato</h2>'+grupos+'</section><aside class="card col side"><h2>Pontos de atenção</h2>'+pontos+'</aside></div>';

function vContrato(p){
  var st=stats(p);
  function coluna(status,titulo){
    var arr=(p.itens||[]).filter(function(i){return i.status===status;});
    return '<section class="card col" style="gap:10px;padding:20px"><div class="between"><h2 style="font-size:20px">'+titulo+'</h2><span class="small muted">'+arr.length+(arr.length===1?' item':' itens')+'</span></div>'+
    (arr.length?arr.map(function(i){
      var flag=i.alteracao&&!i.alteracao.resolvida?'<span class="badge b-b" style="align-self:flex-start">Alterado</span>':(st.esquecidos.indexOf(i)!==-1?'<span class="badge b-o" style="align-self:flex-start">Nunca mencionado em reunião</span>':'');
      var ult=i.mencoes&&i.mencoes.length?'Última menção: reunião de '+br(i.mencoes[i.mencoes.length-1]):'';
      return '<div class="inset col" style="gap:6px;padding:14px"><strong>'+esc(i.nome)+'</strong><span class="small muted">'+i.horas+' h'+(ult?' · '+ult:'')+'</span>'+flag+
      '<label class="small muted" style="display:flex;align-items:center;gap:8px">Situação<select class="in" style="min-height:40px;width:auto" data-f="status-item" data-i="'+i.id+'"><option value="afazer"'+(i.status==='afazer'?' selected':'')+'>A fazer</option><option value="andamento"'+(i.status==='andamento'?' selected':'')+'>Em andamento</option><option value="entregue"'+(i.status==='entregue'?' selected':'')+'>Entregue</option></select></label></div>';
    }).join(''):'<p class="small muted" style="margin:0">Nenhum item aqui.</p>')+'</section>';
  }
  var adic=st.g.cobrado.concat(st.g.cortesia);
  return topo('Contrato e andamento','Tudo o que foi vendido ao cliente, o que já foi entregue e o que falta. Atualizado a cada reunião enviada.')+
  '<section class="card col"><div class="between"><span class="row"><strong>'+st.total+' itens no contrato original</strong><button class="btn" data-a="tab" data-v="original" style="min-height:44px;border-radius:999px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5FD68A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>Ver contrato original</button></span><span class="small muted">Entrega final em '+br(p.fim)+'</span></div><div class="bar" style="height:12px"><span style="width:'+(st.total?st.ent*100/st.total:0)+'%;background:var(--green)"></span><span style="width:'+(st.total?st.and*100/st.total:0)+'%;background:#E8A54B"></span></div>'+

/* ---------- actions ---------- */
document.addEventListener('submit',function(e){
  if(e.target.id!=='loginForm') return; e.preventDefault();
  var em=document.getElementById('lgEmail').value.trim();
  S.me={name: em? nomeDe(em) : 'Visitante'};
  S.view='projetos'; render(); window.scrollTo(0,0); carregar();
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='lgEmail'||t.id==='lgSenha'){ var er=document.getElementById('lgErr'); if(er) er.textContent=''; return; }
  if(t.id==='busca'){ S.busca=t.value; renderLista(); return; }
  if(t.id==='txtProposta'){ S.novo.texto=t.value; return; }
  if(t.id==='txtReuniao'){ S.reuniao.texto=t.value; return; }
  if(t.id==='txtPedido'){ S.pedido.texto=t.value; return; }
  if(t.id==='valorHora'){ S.novo.valorHora=t.value; atualizaTotais(); return; }
  var f=t.getAttribute('data-f');
  if(f==='novo'){ S.novo[t.getAttribute('data-k')]=t.value; }
  else if(f==='reuniao'){ S.reuniao[t.getAttribute('data-k')]=t.value; }
  else if(f==='pedido'){ S.pedido[t.getAttribute('data-k')]=t.value; }
  else if(f==='item-nome'){ S.novo.itens[+t.getAttribute('data-i')].nome=t.value; }
  else if(f==='item-horas'){ S.novo.itens[+t.getAttribute('data-i')].horas=t.value; atualizaTotais(); }
});
function atualizaTotais(){ var y=window.scrollY; render(); window.scrollTo(0,y); var a=document.activeElement; }
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='dataCampo'){ S.dataCampo=t.value; renderLista(); return; }
  if(t.id==='de'){ S.de=t.value; renderLista(); return; }
  if(t.id==='ate'){ S.ate=t.value; renderLista(); return; }
  if(t.getAttribute('data-f')==='reuniao'||t.getAttribute('data-f')==='pedido'||t.getAttribute('data-f')==='novo'){ var o=t.getAttribute('data-f'); S[o][t.getAttribute('data-k')]=t.value; return; }
  if(t.getAttribute('data-f')==='status-item'){
    var p=proj(), id=t.getAttribute('data-i');
    var itens=(p.itens||[]).map(function(i){ return i.id===id? Object.assign({},i,{status:t.value}) : i; });
    salvar(p,{itens:itens}).then(function(){ render(); toast('Situação atualizada'); });
    return;
  }
  if(t.id==='arqProposta'||t.id==='arqReuniao'){
    var file=t.files&&t.files[0]; if(!file) return;
    var alvo=t.id==='arqProposta'?S.novo:S.reuniao;
    alvo.err=''; alvo.arquivo=file.name+' · lendo…'; manterRender();
    lerArquivo(file).then(function(txt){
      txt=(txt||'').trim();
      if(!txt){ alvo.err='Não encontrei texto nesse arquivo. Se for um PDF escaneado, cole o texto manualmente.'; alvo.arquivo=file.name; }
      else { alvo.texto=txt.slice(0,40000); alvo.arquivo=file.name+' · texto carregado'; }
      manterRender();
    }).catch(function(){ alvo.arquivo=file.name; alvo.err='Não consegui ler esse arquivo. Tente PDF, Word (.docx) ou texto (.txt), ou cole o conteúdo.'; manterRender(); });
  }
});
function manterRender(){ var y=window.scrollY; render(); window.scrollTo(0,y); }

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]'); if(!b) return;
  var a=b.getAttribute('data-a'), v=b.getAttribute('data-v');
  if(a==='mic'){ alternarMic(); return; }
  if(a==='ir-projetos'){ S.view='projetos'; S.pid=null; render(); window.scrollTo(0,0); }
  else if(a==='ir-novo'){ S.novo=novoForm(); S.view='novo'; render(); window.scrollTo(0,0); }
  else if(a==='sair'){ S.view='login'; S.pid=null; S.loginErr=''; render(); }
  else if(a==='recarregar'){ carregar(); }
  else if(a==='filtro'){ S.filtro=v; document.querySelectorAll('[data-a="filtro"]').forEach(function(c){ c.setAttribute('aria-pressed',String(c.getAttribute('data-v')===v)); }); renderLista(); }
  else if(a==='abrir'){ S.pid=v; S.tab='placar'; S.view='projeto'; S.reuniao=reuniaoForm(); S.pedido=pedidoForm(); render(); window.scrollTo(0,0); }
  else if(a==='tab'){ S.tab=v; render(); window.scrollTo(0,0); }
  else if(a==='add-item'){ S.novo.itens.push({nome:'',horas:0}); manterRender(); }
  else if(a==='rm-item'){ S.novo.itens.splice(+v,1); manterRender(); }
  else if(a==='ler-proposta') lerProposta();
  else if(a==='salvar-projeto') salvarProjeto();
  else if(a==='decidir') decidir(v,b.getAttribute('data-s'));
  else if(a==='resolver') resolver(v);
  else if(a==='tipo-reuniao'){ S.reuniao.tipo=v; manterRender(); }
  else if(a==='analisar-reuniao') analisarReuniao();
  else if(a==='salvar-reuniao') salvarReuniao();
  else if(a==='descartar-reuniao'){ S.reuniao.res=null; manterRender(); }
  else if(a==='analisar-pedido') analisarPedido();
  else if(a==='criar-pedido') criarPedido(b.getAttribute('data-s'));
  else if(a==='limpar-pedido'){ S.pedido=pedidoForm(); render(); }
});

function alternarMic(){
  var d=cap.dict; if(!d) return;
  if(S.reuniao.ouvindo){ d.stop().catch(function(){}); return; }
  d.start({language:'pt-BR'}).catch(function(err){
    if(err&&err.code==='not_granted'){ S.reuniao.err='O microfone foi bloqueado. Use “Anotações” ou libere o microfone nas permissões.'; manterRender(); }
  });
}

function lerProposta(){
  var n=S.novo; n.err=''; n.msg='';
  if((n.texto||'').trim().length<40){ n.err='Envie a proposta ou cole o texto dela antes de pedir a leitura.'; manterRender(); return; }
  S.ocupado=true; manterRender();
  var prompt='Você lê propostas comerciais de uma empresa júnior de tecnologia (o CITi) e extrai o escopo contratado.\n'+
  'Responda APENAS com JSON válido, sem texto antes ou depois, no formato:\n'+
  '{"nomeProjeto": string|null, "empresa": string|null, "valorHora": number|null, "itens": [{"nome": string, "horas": number}]}\n'+
  'Regras: cada item é uma entrega ou funcionalidade concreta prometida ao cliente, com nome curto em português. Use as horas da proposta quando existirem; se não houver horas por item, estime horas realistas para uma equipe júnior. Se a proposta trouxer valor total e horas totais, calcule valorHora. Não invente itens que não estão na proposta.\n\nPROPOSTA:\n'+n.texto.slice(0,30000);
  ia(prompt).then(function(r){
    var itens=(r&&r.itens||[]).filter(function(i){return i&&i.nome;}).map(function(i){ return {nome:String(i.nome),horas:Math.max(0,Math.round(+i.horas||0))}; });
    if(!itens.length){ n.err='Não encontrei itens de escopo nesse texto. Confira se é a proposta comercial.'; }
    else { n.itens=itens; n.msg=itens.length+' itens encontrados. Revise antes de salvar.'; if(r.nomeProjeto&&!n.nome) n.nome=r.nomeProjeto; if(r.empresa&&!n.empresa) n.empresa=r.empresa; if(r.valorHora) n.valorHora=Math.round(r.valorHora); }
  }).catch(function(e){ n.err=msgErroIA(e); }).then(function(){ S.ocupado=false; manterRender(); });
}

function salvarProjeto(){
  var n=S.novo, err=document.getElementById('novoErr');
  if(!n.nome.trim()||!n.empresa.trim()){ err.textContent='Preencha o nome do projeto e a empresa.'; return; }
  var itens=n.itens.filter(function(i){return String(i.nome).trim();});
  if(!itens.length){ err.textContent='Adicione pelo menos um item do contrato.'; return; }
  if(!sb){ err.textContent='Sem conexão com o banco de dados. Recarregue a página.'; return; }
  var doc={ nome:n.nome.trim(), empresa:n.empresa.trim(), contrato:n.contrato.trim(), gerente:n.gerente.trim(), inicio:n.inicio, fim:n.fim, valorHora:+n.valorHora||0,
    itens: itens.map(function(i){ return {id:uid(), nome:String(i.nome).trim(), horas:+i.horas||0, status:'afazer', mencoes:[]}; }),
    pedidos:[], reunioes:[], criadoEm:hojeISO(), propostaTexto:(n.texto||'').slice(0,40000), propostaArquivo:(n.arquivo||'').replace(' · texto carregado','') };
  var id=uid();
  sb.from('projetos').insert({id:id,dados:doc}).then(function(r){ if(r.error) throw r.error;
    doc.id=id; if(!proj()) S.projetos.push(doc);
    S.pid=id; S.tab='placar'; S.view='projeto'; render(); window.scrollTo(0,0); toast('Projeto salvo');
  }).catch(function(){ err.textContent='Não foi possível salvar. Tente de novo.'; });
}

function decidir(id,status){
  var p=proj(); if(!p) return;
  var peds=(p.pedidos||[]).map(function(x){ return x.id===id? Object.assign({},x,{status:status,decididoEm:status==='pendente'?null:hojeISO()}) : x; });
  salvar(p,{pedidos:peds}).then(function(){ render(); toast(status==='cobrado'?'Pedido marcado como cobrado':status==='cortesia'?'Pedido marcado como cortesia':status==='recusado'?'Pedido recusado':'Pedido voltou para pendente'); });
}
function resolver(id){
  var p=proj();
  var itens=(p.itens||[]).map(function(i){ return i.id===id&&i.alteracao? Object.assign({},i,{alteracao:Object.assign({},i.alteracao,{resolvida:true})}) : i; });
  salvar(p,{itens:itens}).then(function(){ render(); toast('Ponto de atenção resolvido'); });
}

function analisarReuniao(){
  var p=proj(), r=S.reuniao; r.err='';
  if((r.texto||'').trim().length<30){ r.err='Escreva, grave ou envie o conteúdo da reunião antes de analisar.'; manterRender(); return; }
  if(cap.dict && r.ouvindo){ cap.dict.stop().catch(function(){}); }
  S.ocupado=true; manterRender();
  var prompt='Você ajuda o CITi, uma empresa júnior de tecnologia, a acompanhar projetos. Compare o registro de uma reunião com o contrato do projeto.\n'+
  'Responda APENAS com JSON válido, sem texto antes ou depois, no formato:\n'+
  '{"resumo": string, "decisoes": [string], "pendencias": [{"tarefa": string, "responsavel": string|null}], "itensMencionados": [string], "itensEntregues": [string], '+
  '"pedidosExtras": [{"titulo": string, "horasMin": number, "horasMax": number, "prazoDias": number, "justificativa": string, "trecho": string}], '+
  '"alteracoes": [{"itemId": string, "descricao": string, "trecho": string}]}\n'+
  'Regras:\n- itensMencionados e itensEntregues usam os ids dos itens do contrato. itensEntregues só quando a reunião diz claramente que o item foi concluído ou entregue.\n'+
  '- pedidosExtras: pedidos do cliente que NÃO estão em nenhum item do contrato. Estime horas para uma equipe júnior, comparando com as horas de itens parecidos do contrato, e diga na justificativa qual item serviu de base. Ignore pedidos que já constam na lista de pedidos existentes.\n'+
  '- alteracoes: quando a equipe ou o cliente decidiu fazer um item do contrato de forma diferente do combinado, ou retirá-lo.\n'+
  '- trecho: até duas frases do registro, como foram ditas. Resumo em até 3 frases. Tudo em português do Brasil.\n\n'+
  'PROJETO: '+p.nome+' ('+p.empresa+')\nITENS DO CONTRATO:\n'+itensTexto(p)+'\n\nPEDIDOS JÁ REGISTRADOS: '+((p.pedidos||[]).map(function(x){return x.titulo;}).join('; ')||'nenhum')+
  '\n\nREUNIÃO ('+r.categoria+', '+br(r.data)+(r.participantes?', participantes: '+r.participantes:'')+'):\n'+r.texto.slice(0,30000);
  ia(prompt).then(function(x){
    var ids=(p.itens||[]).map(function(i){return i.id;});
    x=x||{};
    x.itensMencionados=(x.itensMencionados||[]).filter(function(i){return ids.indexOf(i)!==-1;});
    x.itensEntregues=(x.itensEntregues||[]).filter(function(i){return ids.indexOf(i)!==-1;});
    x.alteracoes=(x.alteracoes||[]).filter(function(a){return a&&ids.indexOf(a.itemId)!==-1;});
    x.pedidosExtras=(x.pedidosExtras||[]).filter(function(e){return e&&e.titulo;});
    r.res=x;
  }).catch(function(e){ r.err=msgErroIA(e); }).then(function(){ S.ocupado=false; manterRender(); var el=document.querySelector('[aria-label="Resultado da análise"]'); if(el) el.scrollIntoView({behavior:'smooth',block:'start'}); });
}
function salvarReuniao(){
  var p=proj(), r=S.reuniao, x=r.res; if(!x) return;
  var itens=(p.itens||[]).map(function(i){
    var o=Object.assign({},i,{mencoes:(i.mencoes||[]).slice()});
    if(x.itensMencionados.indexOf(i.id)!==-1 || x.itensEntregues.indexOf(i.id)!==-1) o.mencoes.push(r.data);
    if(x.itensEntregues.indexOf(i.id)!==-1) o.status='entregue';
    else if(x.itensMencionados.indexOf(i.id)!==-1 && o.status==='afazer') o.status='andamento';
    x.alteracoes.forEach(function(a){ if(a.itemId===i.id) o.alteracao={descricao:a.descricao,trecho:a.trecho||'',data:r.data,resolvida:false}; });
    return o;
  });
  var novos=x.pedidosExtras.map(function(e){ var h=horasPedido(e); return {id:uid(),titulo:e.titulo,horasMin:+e.horasMin||0,horasMax:+e.horasMax||0,prazoDias:+e.prazoDias||0,valor:h*(+p.valorHora||0),justificativa:e.justificativa||'',trecho:e.trecho||'',status:'pendente',origem:'Reunião '+r.categoria.toLowerCase(),data:r.data}; });
  var reunioes=(p.reunioes||[]).concat([{id:uid(),data:r.data,categoria:r.categoria,participantes:r.participantes,resumo:x.resumo||'',decisoes:x.decisoes||[],pendencias:(x.pendencias||[]).map(function(t){return t.tarefa;})}]);
  salvar(p,{itens:itens,pedidos:(p.pedidos||[]).concat(novos),reunioes:reunioes}).then(function(){
    S.reuniao=reuniaoForm(); S.tab='placar'; render(); window.scrollTo(0,0); toast('Reunião salva no projeto');
  });
}

function analisarPedido(){
  var p=proj(), f=S.pedido; f.err='';
  if((f.texto||'').trim().length<10){ f.err='Escreva o que o cliente pediu.'; manterRender(); return; }
  S.ocupado=true; manterRender();
  var prompt='Você ajuda o CITi, uma empresa júnior de tecnologia, a decidir se um pedido do cliente está no contrato e quanto ele custa.\n'+
  'Responda APENAS com JSON válido, sem texto antes ou depois, no formato:\n'+
  '{"dentroDoContrato": boolean, "titulo": string, "horasMin": number, "horasMax": number, "prazoDias": number, "justificativa": string}\n'+
  'Regras: dentroDoContrato é true só se algum item do contrato já cobre o pedido; nesse caso diga qual na justificativa. Se estiver fora, estime horas para uma equipe júnior comparando com as horas de itens parecidos do contrato, e diga na justificativa qual item serviu de base e por quê, em até 2 frases. titulo: nome curto do pedido. prazoDias: dias úteis a mais no prazo. Em português do Brasil.\n\n'+
  'PROJETO: '+p.nome+'\nITENS DO CONTRATO:\n'+itensTexto(p)+'\n\nPEDIDO DO CLIENTE:\n'+f.texto.slice(0,8000);
  ia(prompt).then(function(x){ if(!x||!x.titulo) throw {}; x.horasMin=Math.round(+x.horasMin||0); x.horasMax=Math.max(x.horasMin,Math.round(+x.horasMax||0)); f.res=x; })
    .catch(function(e){ f.err=msgErroIA(e); }).then(function(){ S.ocupado=false; manterRender(); });
}
function criarPedido(status){
  var p=proj(), f=S.pedido, x=f.res; if(!x) return;
  var h=horasPedido(x);
  var novo={id:uid(),titulo:x.titulo,horasMin:x.horasMin,horasMax:x.horasMax,prazoDias:+x.prazoDias||0,valor:h*(+p.valorHora||0),justificativa:x.justificativa||'',trecho:'',status:status,origem:f.origem,data:f.data,decididoEm:status==='pendente'?null:hojeISO()};
  salvar(p,{pedidos:(p.pedidos||[]).concat([novo])}).then(function(){ S.pedido=pedidoForm(); S.tab='placar'; render(); window.scrollTo(0,0); toast('Pedido registrado'); });
}

render();
conectar();
</script>
